<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0907" />
    <meta name="description" content="Falling shapes demo — PixiJS v8 + TypeScript" />
    <title>Test Shapes</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' rx='3' transform='rotate(45 16 16)' fill='%23d4af37'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1 class="brand"><span class="brand__mark" aria-hidden="true"></span>Test Shapes</h1>
        <p class="app-header__hint">Tap empty space to drop a shape · tap a shape to remove it</p>
      </header>

      <main class="stage-frame">
        <div class="stage" id="stage">
          <div class="hud" id="hud" aria-live="polite"></div>
          <div class="stage__fallback" id="fallback" hidden></div>
        </div>
      </main>

      <footer class="controls" id="controls"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
